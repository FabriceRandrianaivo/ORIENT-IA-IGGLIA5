services:
  - type: web
    name: orientia
    runtime: python
    plan: free
    branch: develop
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run agent/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
